<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Доступ по приглашению</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 system-ui,sans-serif;background:#F6F8FB;color:#302E33;padding:16px;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:#1B1A1E;color:#EAEFF5}}
#gate{max-width:380px;text-align:center}#gate h1{font-size:19px;margin:0 0 8px}#gate p{margin:0;color:#6A6670}[hidden]{display:none!important}</style>
</head><body>
<div id="gate" hidden><h1>Доступ по приглашению</h1><p>Эта страница открывается только по личной ссылке. Если ссылка у вас есть, откройте её целиком.</p></div>
<script>
(async()=>{const gate=()=>document.getElementById("gate").hidden=false;
const ub=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
let k=null; const m=location.hash.match(/k=([A-Za-z0-9_-]{43})/);
if(m){k=m[1]; try{localStorage.setItem("dpk",k)}catch(e){} history.replaceState(null,"",location.pathname+location.search);}
else{try{k=localStorage.getItem("dpk")}catch(e){}}
if(!k||!(window.crypto&&crypto.subtle)) return gate();
try{const key=await crypto.subtle.importKey("raw",ub(k),"AES-GCM",false,["decrypt"]);
const r=await fetch("data.bin",{cache:"no-store"}); const buf=new Uint8Array(await r.arrayBuffer());
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12));
window.__DKS=k; const html=new TextDecoder().decode(pt); document.open(); document.write(html); document.close();
}catch(e){try{localStorage.removeItem("dpk")}catch(_){} gate();}})();
</script>
</body></html>
